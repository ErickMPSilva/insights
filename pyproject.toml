[project]
name = "insights-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "packages/*", "pipelines/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "pipelines"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]